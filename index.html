<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/><title>Dashboard Profissional - Pelada</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg-page:#030806;--bg-panel:#0d1110;--bg-panel-h:#121614;--g:#0fa;--gt:#85ffcc;--t:#f4fff8;--m:#8fa89b;--l:#1e2622;--accent:#2ecc71;--shadow:0 6px 16px rgba(0,0,0,0.4)}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,sans-serif;background-color:var(--bg-page);background-image:linear-gradient(135deg,#030806 0%,#09110d 100%);color:var(--t);overflow-x:hidden}
.app{max-width:1480px;margin:0 auto;padding:40px 20px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:30px;padding-bottom:20px;margin-bottom:30px;border-bottom:1px solid var(--l)}
h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-1px}h2{font-size:16px;font-weight:600;color:var(--m);margin:0 0 15px 8px;text-transform:uppercase;letter-spacing:1px}
.controls{display:flex;align-items:center;gap:12px}.badge{background:var(--bg-panel-h);color:var(--gt);padding:10px 18px;border-radius:999px;border:1px solid var(--l);font-weight:600;font-size:13px;cursor:pointer}
select,button,.ip-v{background:var(--bg-panel-h);color:var(--t);border:1px solid var(--l);padding:11px 16px;border-radius:10px;font-size:15px;cursor:pointer;transition:border-color 0.2s}
select:focus,button:hover,.ip-v:focus{border-color:var(--g);outline:none}.btn-a{background:var(--g);color:#011;font-weight:700;border:0}.btn-a:hover{background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:30px}.card{background:var(--bg-panel);padding:25px;border-radius:18px;border:1px solid var(--l);transition:transform 0.2s,box-shadow 0.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.c-lab{font-size:14px;color:var(--m);margin-bottom:10px;font-weight:500}.c-val{font-size:42px;font-weight:800;color:var(--g)}.c-sub{font-size:14px;color:var(--gt);margin-top:8px}
.charts{display:grid;grid-template-columns:1.2fr 0.8fr;gap:20px;margin-bottom:30px}.chart-p{background:var(--bg-panel);padding:20px;border-radius:18px;border:1px solid var(--l);height:400px}.table-p{background:var(--bg-panel);border-radius:18px;border:1px solid var(--l);padding:15px;margin-bottom:30px}
.table-w{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1100px}
th,td{padding:16px 12px;text-align:center;border-bottom:1px solid var(--l);font-size:15px}
th{background:var(--bg-panel-h);color:var(--m);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:1px}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--bg-panel);z-index:2;padding-left:20px}
tr:hover td{background:var(--bg-panel-h)}tr.tr td{background:var(--bg-panel-h);font-weight:700;color:var(--g)}.p-paid{color:var(--gt);font-weight:700}.p-zero{color:#566}
.st-b{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase}.st-a{background:rgba(15,255,170,0.1);color:#0f0}.st-p{background:rgba(255,170,0,0.1);color:#fa0}.st-l{background:rgba(255,50,50,0.1);color:#f55}
.cell-ip{width:80px;background:transparent;border:1px solid var(--g);color:var(--t);padding:4px;text-align:center;border-radius:4px;font-size:14px}
.p-ctrl{display:flex;gap:5px;margin-top:5px}.btn-s{padding:4px 8px;font-size:11px;border-radius:4px;background:#222}
.p-add{border-top:1px dashed var(--l);padding-top:20px;display:flex;gap:10px}.foot{text-align:center;color:var(--m);font-size:14px;margin-top:50px;border-top:1px solid var(--l);padding-top:20px}
.toast{position:fixed;bottom:20px;right:20px;background:#111;border:1px solid var(--l);color:var(--t);padding:15px 25px;border-radius:10px;box-shadow:var(--shadow);transform:translateY(100px);transition:transform 0.3s;z-index:999}.toast.active{transform:translateY(0)}.t-s{border-color:var(--g);color:var(--gt)}.t-e{border-color:#f55;color:#fbb}
@media(max-width:1000px){.charts{grid-template-columns:1fr}.chart-p{height:350px}.head{flex-direction:column;align-items:flex-start}}
</style></head><body>
<div class="app">
<div class="head"><div><h1>⚽ Confraternização da Pelada</h1><div style="color:var(--m);margin-top:4px">Dashboard em Tempo Real via Supabase</div></div><div class="controls"><select id="fy"></select><button class="btn-a" id="bny" style="display:none" onclick="newYear()">+ Novo Ano</button><button class="badge" onclick="togModAdmin()" id="ab">🔒 Admin</button></div></div>
<div class="cards"><div class="card"><div class="c-lab">Total Arrecadado</div><div class="c-val" id="ct">R$ 0,00</div><div class="c-sub">Todos os pagamentos registrados</div></div><div class="card"><div class="c-lab">Top Mês (Arrecadação)</div><div class="c-val" id="cm">—</div><div class="c-sub" id="cmv">R$ 0,00</div></div><div class="card"><div class="c-lab">Adimplência Geral</div><div class="c-val" id="ca">0%</div><div class="c-sub">Jogadores com tudo pago</div></div></div>
<div class="charts"><div class="chart-p"><div id="bar"></div></div><div class="chart-p"><div id="pie"></div></div></div>
<div class="table-p"><h2>Tabela Detalhada / Lançamentos</h2><div class="table-w"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div><div id="pac" class="p-add" style="display:none"><input class="ip-v" id="pn" placeholder="Nome do novo jogador" type="text"/><button class="btn-a" onclick="addPlayer()">Adicionar Jogador</button></div></div>
<div class="foot">Dashboard Confraternização da Pelada • Sincronizado na Nuvem</div></div>
<div class="toast" id="toast"></div>

<script>
// === SUAS CHAVES DO SUPABASE ===
const SUPABASE_URL = "https://dtnetbjikwvoidyxccah.supabase.co";
const SUPABASE_KEY = "sb_publishable_UMHEG-bz3h4G4dcFR0U3WA_jb5XI8HO";

const MONTHS=["maio","junho","julho","agosto","setembro","outubro"],DEF_PLAYERS=["Binho","David","João Pedro","Lucas Tenorio","Mácio","Mauro","Neto","Yure","Zé","Lucas Vasconcelos","Vinicius(Ryot)","Rodrigo"];
let dbData=[],years=[],cy="2026",isAdmin=false,supaClient=null;
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0),cap=s=>s[0].toUpperCase()+s.slice(1);

async function initSupabase(){
  if(SUPABASE_KEY.startsWith("COLE_")){
    showToast("Cole sua chave anon no código HTML!","e");return;
  }
  supaClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  await fetchFromSupa();
  
  // Realtime subscription (atualiza a tela de todos automaticamente ao salvar)
  supaClient.channel('realtime_pelada').on('postgres_changes',{event:'*',schema:'public',table:'pelada_dados'},()=>{
    fetchFromSupa(true);
  }).subscribe();
}

async function fetchFromSupa(isSilent=false){
  let {data,error}=await supaClient.from('pelada_dados').select('*');
  if(error){showToast('Erro ao carregar dados do Supabase','e');return}
  if(!data||data.length===0){
    await initDefaultData();
    return;
  }
  dbData=data;
  years=[...new Set(dbData.map(d=>d.ano))].sort();
  if(!years.includes(cy)) cy=years[years.length-1]||"2026";
  setupYearsSelect();
  render();
  if(!isSilent) showToast("Dados em tempo real carregados!");
}

async function initDefaultData(){
  let initialRows=DEF_PLAYERS.map(n=>({
    ano:'2026',nome:n,
    maio:['Mácio','Mauro','Yure','Rodrigo'].includes(n)?0:25,
    junho:['Mácio','Mauro','Yure','Rodrigo'].includes(n)?0:25,
    julho:['David','João Pedro','Zé','Lucas Vasconcelos','Vinicius(Ryot)'].includes(n)?25:0,
    agosto:0,setembro:0,outubro:0
  }));
  let {error}=await supaClient.from('pelada_dados').insert(initialRows);
  if(!error) await fetchFromSupa();
}

function setupYearsSelect(){
  let sel=document.getElementById('fy');
  sel.innerHTML=years.map(x=>`<option value="${x}" ${x===cy?'selected':''}>Ano ${x}</option>`).join('');
  sel.onchange=e=>{cy=e.target.value;render()}
}

async function newYear(){
  let n=prompt("Digite o ano que deseja criar (ex: 2027):");if(!n)return;
  if(years.includes(n)){showToast("Esse ano já existe!","e");return}
  let prevPlayers=[...new Set(dbData.map(d=>d.nome))];
  let newRows=prevPlayers.map(nome=>({ano:n,nome,maio:0,junho:0,julho:0,agosto:0,setembro:0,outubro:0}));
  let {error}=await supaClient.from('pelada_dados').insert(newRows);
  if(error) showToast("Erro ao criar novo ano","e");
  else{cy=n;await fetchFromSupa();showToast(`Ano ${n} criado com sucesso!`)}
}

function togModAdmin(){
  if(isAdmin){
    isAdmin=false;
    document.getElementById('ab').textContent='🔒 Admin';
    document.getElementById('pac').style.display='none';
    document.getElementById('bny').style.display='none';
    render();
  }else{
    let p=prompt("Senha de Administrador (Padrão: 1234):");
    if(p==='1234'){
      isAdmin=true;
      document.getElementById('ab').textContent='🔓 Admin Ativo';
      document.getElementById('pac').style.display='flex';
      document.getElementById('bny').style.display='inline-block';
      render();
    }else showToast('Senha incorreta!','e')
  }
}

async function addPlayer(){
  let name=document.getElementById('pn').value.trim();if(!name)return;
  let newRow={ano:cy,nome:name,maio:0,junho:0,julho:0,agosto:0,setembro:0,outubro:0};
  let {error}=await supaClient.from('pelada_dados').insert([newRow]);
  if(error) showToast("Erro ao adicionar jogador","e");
  else{document.getElementById('pn').value='';showToast(`${name} adicionado!`)}
}

async function updatePayment(rowId,month,value){
  let val=parseFloat(value)||0;
  let {error}=await supaClient.from('pelada_dados').update({[month]:val}).eq('id',rowId);
  if(error) showToast("Erro ao salvar pagamento","e");
}

async function quickAdd(rowId,month,currentVal,addVal){
  let val=(parseFloat(currentVal)||0)+addVal;
  await updatePayment(rowId,month,val);
}

function render(){
  let filteredData=dbData.filter(d=>d.ano===cy);
  let mTotals=MONTHS.map(m=>filteredData.reduce((a,r)=>a+(+r[m]||0),0));
  let tot=mTotals.reduce((a,b)=>a+b,0);
  let max=Math.max(...mTotals),topM=MONTHS.filter((m,i)=>mTotals[i]===max&&max>0).map(cap);
  
  document.getElementById('ct').textContent=fmt(tot);
  document.getElementById('cm').textContent=topM.length?topM.join(' e '):'—';
  document.getElementById('cmv').textContent=topM.length?fmt(max):'R$ 0,00';
  
  let fullyPaid=filteredData.filter(r=>MONTHS.every(m=>(+r[m]||0)>=25)).length;
  let pct=filteredData.length?Math.round((fullyPaid/filteredData.length)*100):0;
  document.getElementById('ca').textContent=`${pct}%`;

  Plotly.react('bar',[{x:MONTHS.map(cap),y:mTotals,type:'bar',marker:{color:'#0fa'},hovertemplate:'%{x}<br><b>R$ %{y:.2f}</b><extra></extra>'}],
  {paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#f4fff8'},margin:{l:45,r:15,t:20,b:35},yaxis:{gridcolor:'#1e2622',tickprefix:'R$ '},xaxis:{gridcolor:'transparent'}},{responsive:true,displayModeBar:false});

  let pData=filteredData.map(r=>({n:r.nome,v:MONTHS.reduce((a,m)=>a+(+r[m]||0),0)})).filter(x=>x.v>0);
  Plotly.react('pie',[{labels:pData.map(x=>x.n),values:pData.map(x=>x.v),type:'pie',hole:.5,textinfo:'percent',hovertemplate:'%{label}<br>R$ %{value:.2f}<extra></extra>'}],
  {paper_bgcolor:'transparent',font:{color:'#f4fff8'},margin:{l:0,r:120,t:20,b:20},legend:{x:1.1,xanchor:'left',y:0.5,itemwidth:1}},{responsive:true,displayModeBar:false});

  document.getElementById('th').innerHTML='<th>Jogador</th>'+MONTHS.map(m=>`<th>${cap(m)}</th>`).join('')+'<th>Total</th><th>Status</th>';
  let body=filteredData.map(r=>{
    let rTot=MONTHS.reduce((a,m)=>a+(+r[m]||0),0);
    let st=rTot>=150?'<span class="st-b st-a">Em Dia</span>':rTot>0?'<span class="st-b st-p">Parcial</span>':'<span class="st-b st-l">Pendente</span>';
    let cells=MONTHS.map(m=>{
      let v=+r[m]||0;
      if(isAdmin){
        return `<td><input class="cell-ip" type="number" value="${v}" onchange="updatePayment(${r.id},'${m}',this.value)" /><div class="p-ctrl"><button class="btn-s" onclick="quickAdd(${r.id},'${m}',${v},25)">+25</button><button class="btn-s" onclick="updatePayment(${r.id},'${m}',0)">C</button></div></td>`;
      }
      return `<td class="${v?'p-paid':'p-zero'}">${v?fmt(v):'—'}</td>`;
    }).join('');
    return `<tr><td><b>${r.nome}</b></td>${cells}<td class="p-paid">${fmt(rTot)}</td><td>${st}</td></tr>`;
  }).join('');
  
  let totalCells=MONTHS.map(m=>`<td class="p-paid">${fmt(filteredData.reduce((a,r)=>a+(+r[m]||0),0))}</td>`).join('');
  document.getElementById('tb').innerHTML=body+`<tr class="tr"><td>TOTAL</td>${totalCells}<td>${fmt(tot)}</td><td>—</td></tr>`;
}

function showToast(msg,type='s'){
  let t=document.getElementById('toast');t.textContent=msg;t.className=`toast active ${type==='s'?'t-s':'t-e'}`;
  setTimeout(()=>t.className='toast',3000);
}

initSupabase();
</script></body></html>
